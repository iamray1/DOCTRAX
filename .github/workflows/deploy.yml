name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu VM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || '22' }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_BRANCH="${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}"
            PHP_BIN="${{ secrets.PHP_BIN }}"
            COMPOSER_BIN="${{ secrets.COMPOSER_BIN }}"

            PHP_BIN="${PHP_BIN:-php}"
            COMPOSER_BIN="${COMPOSER_BIN:-composer}"

            cd "$DEPLOY_PATH"

            if [ ! -f artisan ]; then
              echo "artisan not found in $DEPLOY_PATH"
              exit 1
            fi

            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git pull --ff-only origin "$DEPLOY_BRANCH"

            "$COMPOSER_BIN" install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            "$PHP_BIN" artisan migrate --force
            "$PHP_BIN" artisan optimize:clear
            "$PHP_BIN" artisan config:cache
            "$PHP_BIN" artisan view:cache
            "$PHP_BIN" artisan queue:restart || true
